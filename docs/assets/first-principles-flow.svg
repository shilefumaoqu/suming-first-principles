<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">第一性原理六步推导流程</title>
  <desc id="desc">从真实痛点、基本事实、拿掉现成方案、最低需求、重建方案到最小验证的六步流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .phase { font: 600 13px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #6366f1; letter-spacing: .08em; }
      .step { font: 700 17px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .hint { font: 400 12px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .num { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fff; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1; }
      .card-accent { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <text x="40" y="45" class="title">从问题出发，而不是从现成方案出发</text>
  <text x="40" y="76" class="phase">理解</text>
  <line x1="40" y1="84" x2="392" y2="84" stroke="#c7d2fe" stroke-width="3"/>
  <text x="424" y="76" class="phase">推导</text>
  <line x1="424" y1="84" x2="776" y2="84" stroke="#ddd6fe" stroke-width="3"/>
  <text x="808" y="76" class="phase">重建与验证</text>
  <line x1="808" y1="84" x2="1160" y2="84" stroke="#c7d2fe" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="40" y="112" width="160" height="128" rx="16" class="card"/>
    <rect x="232" y="112" width="160" height="128" rx="16" class="card"/>
    <rect x="424" y="112" width="160" height="128" rx="16" class="card-accent"/>
    <rect x="616" y="112" width="160" height="128" rx="16" class="card-accent"/>
    <rect x="808" y="112" width="160" height="128" rx="16" class="card"/>
    <rect x="1000" y="112" width="160" height="128" rx="16" class="card"/>
  </g>

  <g>
    <circle cx="64" cy="136" r="13" fill="#6366f1"/><text x="64" y="140" text-anchor="middle" class="num">1</text>
    <circle cx="256" cy="136" r="13" fill="#6366f1"/><text x="256" y="140" text-anchor="middle" class="num">2</text>
    <circle cx="448" cy="136" r="13" fill="#8b5cf6"/><text x="448" y="140" text-anchor="middle" class="num">3</text>
    <circle cx="640" cy="136" r="13" fill="#8b5cf6"/><text x="640" y="140" text-anchor="middle" class="num">4</text>
    <circle cx="832" cy="136" r="13" fill="#6366f1"/><text x="832" y="140" text-anchor="middle" class="num">5</text>
    <circle cx="1024" cy="136" r="13" fill="#6366f1"/><text x="1024" y="140" text-anchor="middle" class="num">6</text>
  </g>

  <text x="120" y="174" text-anchor="middle" class="step">真实痛点</text>
  <text x="120" y="199" text-anchor="middle" class="hint">到底要解决什么</text>
  <text x="312" y="174" text-anchor="middle" class="step">基本事实</text>
  <text x="312" y="199" text-anchor="middle" class="hint">事实、约束与未知</text>
  <text x="504" y="174" text-anchor="middle" class="step">拿掉现成方案</text>
  <text x="504" y="199" text-anchor="middle" class="hint">不被当前做法绑住</text>
  <text x="696" y="174" text-anchor="middle" class="step">最低需求</text>
  <text x="696" y="199" text-anchor="middle" class="hint">什么必须成立</text>
  <text x="888" y="174" text-anchor="middle" class="step">重建方案</text>
  <text x="888" y="199" text-anchor="middle" class="hint">复用、改造或自建</text>
  <text x="1080" y="174" text-anchor="middle" class="step">最小验证</text>
  <text x="1080" y="199" text-anchor="middle" class="hint">用最低成本求证</text>

  <line x1="202" y1="176" x2="224" y2="176" class="line"/>
  <line x1="394" y1="176" x2="416" y2="176" class="line"/>
  <line x1="586" y1="176" x2="608" y2="176" class="line"/>
  <line x1="778" y1="176" x2="800" y2="176" class="line"/>
  <line x1="970" y1="176" x2="992" y2="176" class="line"/>

  <text x="600" y="282" text-anchor="middle" class="hint">先推导需求，再搜索成熟方案；用验证结果决定继续、调整或停止。</text>
</svg>
